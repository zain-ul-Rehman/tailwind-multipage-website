<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - My Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="text-xl font-bold text-blue-600">MyBrand</a>
            <div class="space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                <a href="about.html" class="text-gray-600 hover:text-blue-600">About</a>
                <a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a>
            </div>
            <div class="space-x-3">
                <a href="signin.html" class="text-gray-700 hover:text-blue-600 font-medium">Sign In</a>
                <a href="signup.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-10">
        <!-- COMPONENT 1: Form Card Container -->
        <div class="w-full max-w-md bg-white p-6 rounded-lg border shadow-sm">

            <!-- COMPONENT 2: Header Badge -->
            <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded mb-3">Registration</span>
            <h2 class="text-2xl font-bold text-gray-900 mb-1">Create an Account</h2>
            <p class="text-sm text-gray-500 mb-6">Enter your details to sign up.</p>

            <form class="space-y-4" onsubmit="event.preventDefault(); alert('Registered successfully!'); window.location.href='signin.html';">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" required placeholder="John Doe" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" required placeholder="john@example.com" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none" />
                </div>

                <!-- COMPONENT 3: Checkbox -->
                <div class="flex items-center">
                    <input type="checkbox" id="terms" required class="h-4 w-4 border-gray-300 rounded text-blue-600" />
                    <label for="terms" class="ml-2 text-xs text-gray-600">I accept terms and conditions</label>
                </div>

                <!-- COMPONENT 4: Action Button -->
                <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 rounded text-sm hover:bg-blue-700">Sign Up</button>

                <!-- COMPONENT 5: Navigation Link (Strictly as requested) -->
                <div class="text-center pt-3 border-t">
                    <p class="text-sm text-gray-600">
                        Already have an account? <a href="signin.html" class="text-blue-600 font-semibold hover:underline">Sign in.</a>
                    </p>
                </div>
            </form>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-800 text-gray-300 py-6 text-center mt-auto">
        <p class="text-sm">&copy; 2026 MyBrand. All rights reserved.</p>
    </footer>

</body>
</html>
