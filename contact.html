<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - My Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="text-xl font-bold text-blue-600">MyBrand</a>
            <div class="space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                <a href="about.html" class="text-gray-600 hover:text-blue-600">About</a>
                <a href="contact.html" class="text-blue-600 font-semibold">Contact</a>
            </div>
            <div class="space-x-3">
                <a href="signin.html" class="text-gray-700 hover:text-blue-600 font-medium">Sign In</a>
                <a href="signup.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-10 flex-1 w-full space-y-6">

        <!-- 1. FLOWBITE BREADCRUMB -->
        <nav class="flex text-sm text-gray-500">
            <a href="index.html" class="hover:text-blue-600">Home</a>
            <span class="mx-2">/</span>
            <span class="text-blue-600 font-medium">Contact</span>
        </nav>

        <!-- 2. FLOWBITE ALERT -->
        <div class="p-4 text-sm text-blue-800 rounded-lg bg-blue-50 border border-blue-200">
            Fill out the form below to contact our support team.
        </div>

        <!-- 3. CONTACT FORM (Integrated with Formspree) -->
        <div class="bg-white p-6 rounded-lg border shadow-sm">
            <h2 class="text-2xl font-bold mb-4">Contact Us</h2>

            <!-- REPLACE 'YOUR_ENDPOINT_HERE' WITH YOUR FORMSPREE FORM ID -->
            <form action="https://formspree.io/f/xjykgwpq" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" name="name" required placeholder="Your Name" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" name="_replyto" required placeholder="you@example.com" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea name="message" rows="4" required placeholder="Write your message..." class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 rounded hover:bg-blue-700 text-sm">Send Message</button>
            </form>
        </div>

        <!-- 4. FLOWBITE CARD (Info) -->
        <div class="bg-white p-4 rounded-lg border text-sm text-gray-600">
            <p><strong>Email:</strong> info@example.com</p>
            <p><strong>Location:</strong> Lahore, Pakistan</p>
        </div>

        <!-- 5. FLOWBITE BUTTON / MODAL TRIGGER -->
        <button data-modal-target="contactModal" data-modal-toggle="contactModal" class="w-full bg-gray-200 text-gray-700 text-sm py-2 rounded hover:bg-gray-300">
            Need Immediate Help?
        </button>

        <!-- FLOWBITE MODAL -->
        <div id="contactModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-md max-h-full">
                <div class="relative bg-white rounded-lg shadow p-6 text-center">
                    <h3 class="text-lg font-bold mb-2">Office Hours</h3>
                    <p class="text-sm text-gray-500 mb-4">Monday - Friday: 9:00 AM - 5:00 PM</p>
                    <button data-modal-hide="contactModal" class="bg-blue-600 text-white text-sm px-4 py-2 rounded">Close</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-800 text-gray-300 py-6 text-center mt-auto">
        <p class="text-sm">&copy; 2026 MyBrand. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
