<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - My Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="text-xl font-bold text-blue-600">MyBrand</a>
            <div class="space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                <a href="about.html" class="text-gray-600 hover:text-blue-600">About</a>
                <a href="contact.html" class="text-gray-600 hover:text-blue-600">Contact</a>
            </div>
            <div class="space-x-3">
                <a href="signin.html" class="text-blue-600 font-semibold">Sign In</a>
                <a href="signup.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-10">
        <!-- 1. FLOWBITE CARD CONTAINER -->
        <div class="w-full max-w-md bg-white p-6 rounded-lg border shadow-sm">

            <!-- 2. FLOWBITE ALERT -->
            <div class="p-3 mb-4 text-xs text-blue-800 rounded-lg bg-blue-50 border border-blue-200">
                Please sign in with your credentials.
            </div>

            <h2 class="text-2xl font-bold text-gray-900 mb-1">Sign In</h2>
            <p class="text-sm text-gray-500 mb-6">Welcome back to your dashboard.</p>

            <form class="space-y-4" onsubmit="event.preventDefault(); alert('Signed in!'); window.location.href='index.html';">
                <!-- 3. INPUT FIELDS -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" required placeholder="name@example.com" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-blue-500 focus:outline-none" />
                </div>

                <!-- 4. FLOWBITE TOGGLE / CHECKBOX -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-xs text-gray-600">
                        <input type="checkbox" class="rounded border-gray-300 text-blue-600 mr-2" />
                        Remember me
                    </label>
                    <a href="#" class="text-xs text-blue-600 hover:underline">Forgot password?</a>
                </div>

                <!-- 5. FLOWBITE BUTTON -->
                <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 rounded text-sm hover:bg-blue-700">Sign In</button>

                <!-- REQUIRED EXACT SPECIFICATION LINK -->
                <div class="text-center pt-3 border-t">
                    <p class="text-sm text-gray-600">
                        Don't have an account? <a href="signup.html" class="text-blue-600 font-semibold hover:underline">Sign up.</a>
                    </p>
                </div>
            </form>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-800 text-gray-300 py-6 text-center mt-auto">
        <p class="text-sm">&copy; 2026 MyBrand. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
